<div class="min-h-screen bg-gray-50">

  <app-particulier-nav></app-particulier-nav>

  <main class="max-w-4xl mx-auto px-4 py-6">

    <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2 mb-6">
      <i class="pi pi-cog text-blue-900"></i>Paramètres
    </h1>

    <!-- Loader -->
    <div *ngIf="isLoading" class="flex items-center justify-center py-20">
      <i class="pi pi-spin pi-spinner text-blue-700 text-3xl"></i>
    </div>

    <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-4 gap-6">

      <!-- Nav latérale -->
      <div class="md:col-span-1">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 flex md:flex-col gap-1">
          <button *ngFor="let item of navItems" (click)="goTo(item.id)"
                  class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold text-left transition"
                  [ngClass]="activeSection === item.id ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'">
            <i [class]="item.icon"></i>{{ item.label }}
          </button>
          <button (click)="logout()"
                  class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold text-left
                         text-red-500 hover:bg-red-50 transition">
            <i class="pi pi-sign-out"></i>Déconnexion
          </button>
        </div>
      </div>

      <!-- Contenu -->
      <div class="md:col-span-3">

        <!-- Messages -->
        <div *ngIf="successMsg" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700 flex items-center gap-2">
          <i class="pi pi-check-circle"></i>{{ successMsg }}
        </div>
        <div *ngIf="errorMsg" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 flex items-center gap-2">
          <i class="pi pi-exclamation-triangle"></i>{{ errorMsg }}
        </div>

        <!-- Profil -->
        <div *ngIf="activeSection === 'profil'" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-xl">
              {{ initiales() }}
            </div>
            <div>
              <p class="font-bold text-gray-900">{{ profile.prenom }} {{ profile.nom }}</p>
              <p class="text-sm text-gray-500">Compte particulier</p>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Prénom</label>
              <input [(ngModel)]="profile.prenom" type="text"
                     class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nom</label>
              <input [(ngModel)]="profile.nom" type="text"
                     class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
              <input [(ngModel)]="profile.email" type="email"
                     class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Téléphone</label>
              <input [(ngModel)]="profile.telephone" type="text"
                     class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Secteur d'activité</label>
              <select [(ngModel)]="profile.secteurActivite"
                      class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                <option value="">Sélectionner...</option>
                <option *ngFor="let s of secteurs" [value]="s.code">{{ s.icone }} {{ s.libelle }}</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Poste actuel</label>
              <input [(ngModel)]="profile.posteActuel" type="text"
                     class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Bio</label>
              <textarea [(ngModel)]="profile.bio" rows="3"
                        class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm resize-none outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"></textarea>
            </div>
          </div>

          <label class="flex items-center gap-2 mt-4 cursor-pointer select-none">
            <input type="checkbox" [(ngModel)]="profile.newsletter" class="w-4 h-4">
            <span class="text-sm text-gray-700">Recevoir la newsletter DouniyaConnect</span>
          </label>

          <div class="flex justify-end mt-6">
            <button (click)="saveProfile()" [disabled]="isSaving"
                    class="flex items-center gap-2 bg-blue-900 text-white text-sm font-bold px-6 py-2.5
                           rounded-lg hover:bg-blue-800 transition disabled:opacity-50">
              <i *ngIf="isSaving" class="pi pi-spin pi-spinner"></i>
              {{ isSaving ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
          </div>
        </div>

        <!-- Sécurité -->
        <div *ngIf="activeSection === 'securite'" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h2 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="pi pi-lock text-blue-900"></i>Changer le mot de passe
          </h2>

          <div class="space-y-4 max-w-md">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Mot de passe actuel</label>
              <div class="relative">
                <input [(ngModel)]="pwd.current" [type]="showCurrent ? 'text' : 'password'"
                       class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm pr-10 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                <button type="button" (click)="showCurrent = !showCurrent"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                  <i class="pi" [ngClass]="showCurrent ? 'pi-eye-slash' : 'pi-eye'"></i>
                </button>
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nouveau mot de passe</label>
              <div class="relative">
                <input [(ngModel)]="pwd.newPwd" [type]="showNew ? 'text' : 'password'"
                       class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm pr-10 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                <button type="button" (click)="showNew = !showNew"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                  <i class="pi" [ngClass]="showNew ? 'pi-eye-slash' : 'pi-eye'"></i>
                </button>
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5">Confirmer le mot de passe</label>
              <div class="relative">
                <input [(ngModel)]="pwd.confirm" [type]="showConfirm ? 'text' : 'password'"
                       class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm pr-10 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                <button type="button" (click)="showConfirm = !showConfirm"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                  <i class="pi" [ngClass]="showConfirm ? 'pi-eye-slash' : 'pi-eye'"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="flex justify-end mt-6">
            <button (click)="savePassword()" [disabled]="isSaving"
                    class="flex items-center gap-2 bg-blue-900 text-white text-sm font-bold px-6 py-2.5
                           rounded-lg hover:bg-blue-800 transition disabled:opacity-50">
              <i *ngIf="isSaving" class="pi pi-spin pi-spinner"></i>
              {{ isSaving ? 'Enregistrement...' : 'Modifier le mot de passe' }}
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>
